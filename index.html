<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>บ้านพัก รพ.วานรนิวาส</title>
<meta name="description" content="ระบบบริหารบ้านพักบุคลากร โรงพยาบาลวานรนิวาส">
<meta name="theme-color" content="#141A2E">
<!-- เปิดเต็มจอเหมือนแอปเมื่อเพิ่มลงหน้าจอโฮม -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="บ้านพัก">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{--bg:#141A2E;--ink:#fff;--muted:#A9B0C9;--accent:#6D5BF0}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  body{font-family:system-ui,-apple-system,"Segoe UI",Sarabun,sans-serif;color:var(--ink);
       padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
  #app{position:absolute;inset:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
       width:calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right));height:calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));
       border:0;background:#F4F6FB}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
          background:var(--bg);transition:opacity .35s ease;z-index:2}
  #splash.gone{opacity:0;pointer-events:none}
  #splash img{width:96px;height:96px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  #splash h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.2px}
  #splash p{margin:0;font-size:14px;color:var(--muted)}
  .bar{width:140px;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:var(--accent);border-radius:3px;animation:run 1.1s ease-in-out infinite}
  @keyframes run{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  #err{display:none;text-align:center;max-width:300px;padding:0 20px}
  #err button{margin-top:14px;font:inherit;font-size:15px;padding:10px 22px;border-radius:12px;border:0;background:var(--accent);color:#fff}
  @media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}#splash{transition:none}}
</style>
</head>
<body>
<div id="splash" role="status" aria-live="polite">
  <img src="icons/icon-192.png" alt="">
  <h1>บ้านพัก รพ.วานรนิวาส</h1>
  <div id="loading"><div class="bar"><i></i></div><p style="margin-top:12px;text-align:center">กำลังเปิดระบบ…</p></div>
  <div id="err"><p id="errMsg">ไม่มีการเชื่อมต่ออินเทอร์เน็ต</p><button onclick="openApp()">ลองใหม่</button></div>
</div>
<iframe id="app" title="ระบบบริหารบ้านพักบุคลากร" allow="clipboard-write; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
<script>
  // ลิงก์เว็บแอป (ไม่เปลี่ยนเมื่อออกเวอร์ชันใหม่ใน "จัดการการทำให้ใช้งานได้")
  var APP_URL = 'https://script.google.com/macros/s/AKfycbzZj8yCLfCkwHcSE8yrY3WYNMMlzELlQqU3zJf7A-6alEovcnCQ8_fWi88_bCVKVihF/exec';
  var frame = document.getElementById('app'), splash = document.getElementById('splash'), slow;
  function showErr(msg) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('err').style.display = 'block';
    document.getElementById('errMsg').textContent = msg;
    splash.classList.remove('gone');
  }
  function openApp() {
    if (!navigator.onLine) { showErr('ไม่มีการเชื่อมต่ออินเทอร์เน็ต — ตรวจสอบ Wi-Fi หรือข้อมูลมือถือ แล้วกดลองใหม่'); return; }
    document.getElementById('loading').style.display = 'block';
    document.getElementById('err').style.display = 'none';
    splash.classList.remove('gone');
    clearTimeout(slow);
    slow = setTimeout(function () { showErr('เปิดระบบช้ากว่าปกติ อาจเป็นเพราะสัญญาณอินเทอร์เน็ต'); }, 40000);
    // ส่งหน้าที่ต้องการต่อไปให้เว็บแอป เช่น ...?page=board → #/board
    var hash = location.hash || (new URLSearchParams(location.search).get('page') ? '#/' + new URLSearchParams(location.search).get('page') : '');
    frame.src = APP_URL + hash;
  }
  frame.addEventListener('load', function () {
    if (!frame.src) return;
    clearTimeout(slow);
    setTimeout(function () { splash.classList.add('gone'); }, 600);   // รอหน้าแรกของระบบวาดเสร็จ
  });
  window.addEventListener('online', function () { if (document.getElementById('err').style.display === 'block') openApp(); });
  openApp();
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>
</body>
</html>
